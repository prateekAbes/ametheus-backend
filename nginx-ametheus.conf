# ==============================================================================
# AMETHEUS Production Nginx Configuration (api.ametheus.games)
# ==============================================================================
# Place in /etc/nginx/sites-available/api.ametheus.games
# and symlink to /etc/nginx/sites-enabled/
#
# Crucial Directives:
# 1. client_max_body_size 25M;
#    Permits direct uploads of high-resolution tournament banners, mobile
#    stories, and evidence proofs up to 25MB without 413 drops.
# 2. CORS on error responses (error_page 413):
#    Ensures cross-origin browser requests receive proper CORS headers even
#    if an error occurs at the Nginx layer, avoiding opaque "Failed to fetch".
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.ametheus.games;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ametheus.games;

    # SSL Certificate Configuration (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/api.ametheus.games/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.ametheus.games/privkey.pem;

    # Allow up to 25MB request entity size
    client_max_body_size 25M;
    client_body_buffer_size 1M;

    # Timeouts for large uploads
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent Nginx from intercepting application error responses
        proxy_intercept_errors off;
    }

    # Custom 413 error handler ensuring CORS header is present
    error_page 413 = @json_413;
    location @json_413 {
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://www.ametheus.games" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Methods "*" always;
        return 413 '{"detail": "File size exceeds server limit of 25MB"}';
    }
}
